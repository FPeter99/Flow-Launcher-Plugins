body:
  - type: checkbox
    attributes:
      name: tryIncognito
      label: Try incognito
      description: Claude és ChatGPT incognito/temporary chat URL-en nyílik. A többinél (Copilot, Gemini, Meta AI, Grok) nincs külön URL.
      defaultValue: false
  - type: textBlock
    attributes:
      label: Visible AI services
      description: Choose which services appear after imgai. The up and down arrows select one, and Enter opens it.
  - type: checkbox
    attributes:
      name: show_copilot
      label: Show Copilot
      defaultValue: true
  - type: checkbox
    attributes:
      name: show_gemini
      label: Show Gemini
      defaultValue: true
  - type: checkbox
    attributes:
      name: show_claude
      label: Show Claude
      defaultValue: true
  - type: checkbox
    attributes:
      name: show_chatgpt
      label: Show ChatGPT
      defaultValue: true
  - type: checkbox
    attributes:
      name: show_meta
      label: Show Meta AI
      defaultValue: true
  - type: checkbox
    attributes:
      name: show_grok
      label: Show Grok
      defaultValue: true
